<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="fence" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H28M0 0V28" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#d20a11" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d20a11" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brass" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset=".45" stop-color="#e8b21a"/>
      <stop offset="1" stop-color="#8a5d06"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#08090b"/>
  <rect width="512" height="512" fill="url(#fence)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- octagon cage -->
  <polygon points="168,44 344,44 468,168 468,344 344,468 168,468 44,344 44,168" fill="#d20a11"/>
  <polygon points="177,66 335,66 446,177 446,335 335,446 177,446 66,335 66,177" fill="#131518"/>
  <polygon points="177,66 335,66 446,177 446,335 335,446 177,446 66,335 66,177" fill="url(#fence)"/>
  <!-- wall bracket -->
  <rect x="240" y="96" width="32" height="64" fill="#8d9198"/>
  <!-- bell, front view -->
  <circle cx="256" cy="262" r="128" fill="url(#brass)"/>
  <circle cx="256" cy="262" r="128" fill="none" stroke="#5c3d02" stroke-width="6"/>
  <circle cx="256" cy="262" r="92" fill="none" stroke="#8a5d06" stroke-opacity=".7" stroke-width="5"/>
  <circle cx="256" cy="262" r="56" fill="none" stroke="#8a5d06" stroke-opacity=".55" stroke-width="5"/>
  <circle cx="256" cy="262" r="20" fill="#f5f5f3"/>
  <circle cx="226" cy="222" r="26" fill="#fff" opacity=".35"/>
  <!-- hammer striking the rim -->
  <path d="M372 366 L432 316" stroke="#f5f5f3" stroke-width="14" stroke-linecap="round"/>
  <path d="M352 350 L384 386" stroke="#f5f5f3" stroke-width="28" stroke-linecap="round"/>
  <!-- ring lines -->
  <g stroke="#f5f5f3" stroke-width="12">
    <path d="M110 170 L90 150"/><path d="M98 226 L72 220"/>
    <path d="M402 170 L422 150"/><path d="M414 226 L440 220"/>
  </g>
</svg>
